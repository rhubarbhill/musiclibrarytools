            <script>
                function handleTextareaInput() {
                    const textarea = document.querySelector("#descriptor-area");
                    const typedWords = textarea.value.split(";").map(word => word.trim());

                    // Remove all existing strike classes
                    document.querySelectorAll(".strike").forEach(el => el.classList.remove("strike"));

                    // Strike out matching words
                    typedWords.forEach(word => {
                        const el = document.getElementById(word);
                        if (el) el.classList.add("strike");
                    });
                }

                function writeText(descriptor) {
                    const descriptorCell = document.getElementById(descriptor);
                    if (descriptorCell) {
                        descriptorCell.classList.add("strike");
                    }

                    const textarea = document.querySelector("#descriptor-area");
                    const current = textarea.value.trim();

                    if (current === "") {
                        textarea.value = descriptor;
                    } else {
                        textarea.value += `; ${descriptor}`;
                    }
                }

                function copyAll() {
                    const textarea = document.querySelector("#descriptor-area");
                    textarea.select();
                    document.execCommand("copy");
                    // alert("Copied to clipboard!");
                }

                // function reset() {
                //     document.querySelectorAll(".strike").forEach(el => el.classList.remove("strike"));
                //     document.querySelector("#descriptor-area").value = "";
                // }

                let lastDescriptorValue = ""; // Temporary backup

                function reset() {
                    const descriptorArea = document.querySelector("#descriptor-area");
                    lastDescriptorValue = descriptorArea.value; // Save current value
                    document.querySelectorAll(".strike").forEach(el => el.classList.remove("strike"));
                    descriptorArea.value = ""; // Clear the field
                    console.log("Value saved before reset:", lastDescriptorValue);
                }

                // Attach event listeners
                document.querySelectorAll("button[data-descriptor]").forEach(button => {
                    button.addEventListener("click", () => {
                        const descriptor = button.getAttribute("data-descriptor");
                        writeText(descriptor);
                    });
                });

                document.querySelector("#descriptor-area").addEventListener("input", handleTextareaInput);
                document.querySelector("#copy-button").addEventListener("click", copyAll);
                document.querySelector("#reset-button").addEventListener("click", reset);
            </script>

                function updateTierList() {
                    const text = textarea.value.trim();
                    const lines = text.split("\n").map(line => line.trim()).filter(Boolean);
                    const counts = {};
                    const firstAppearance = {};

                    lines.forEach((line, lineIndex) => {
                        const descriptors = line.split(";").map(d => d.trim()).filter(Boolean);

                        descriptors.forEach(d => {
                            // NEW: skip if descriptor is in excluded list
                            if (excludedDescriptors.includes(d)) return;

                            if (!(d in counts)) {
                                counts[d] = 0;
                                firstAppearance[d] = lineIndex; // record first line where it appears
                            }
                            counts[d]++;
                        });
                    });

                    // Sort descriptors by frequency (descending), then by first appearance
                    const sorted = Object.entries(counts).sort((a, b) =>
                        b[1] - a[1] || firstAppearance[a[0]] - firstAppearance[b[0]]
                    );

                    // Build the "Multi" tier (descriptors appearing 2+ times)
                    const multi = sorted.filter(([desc, count]) => count > 1).map(([desc]) => desc);
                    multiList.textContent = multi.join("; ");

                    // Build tiered display
                    const tiers = {};
                    sorted.forEach(([desc, count]) => {
                        if (!tiers[count]) tiers[count] = [];
                        tiers[count].push(desc);
                    });

                    tierList.innerHTML = "";
                    Object.keys(tiers).sort((a, b) => b - a).forEach(count => {
                        const tierDiv = document.createElement("div");
                        tierDiv.className = "tier";
                        tierDiv.innerHTML = `<strong>${count}:</strong> ${tiers[count].join("; ")}`;
                        tierList.appendChild(tierDiv);
                    });
                }



                // Copy multi list to clipboard
                copyButton.addEventListener("click", () => {
                    navigator.clipboard.writeText(multiList.textContent).then(() => {
                        copyButton.textContent = "Copied!";
                        setTimeout(() => copyButton.textContent = "Copy", 1000);
                    });
                });

                textarea.addEventListener("input", updateTierList);
            </script>

                <button class="top-button" id="random-new-button">Random New</button>
                <button class="top-button" id="random-replace-all-button">Random Replace All</button>
                <button class="delete-all" id="delete-all-button" style="background-color: red; color: white;">Delete
                    All</button>
            </div>

            <div class="song-page">
                <div class="song-container">
                    <ol id="task-list"></ol>
                </div>

                <div class="search-container">
                    <!-- Inputs for filtering -->
                    <input type="text" placeholder="Search by artist..." id="artist-search">
                    <input type="text" placeholder="[Song name search: Will fix later]" id="name-search">
                    <div class="search-group">
                        <input type="text" id="genre-search" placeholder="Search by genre...">
                        <label>
                            <input type="checkbox" id="include-all-genres"> Include all
                        </label>
                    </div>
                    <div class="search-group">
                        <input type="text" id="descriptor-search" placeholder="Search by descriptor...">
                        <label>
                            <input type="checkbox" id="include-all-descriptors"> Include all
                        </label>
                    </div>
                    <input type="text" placeholder="Search by year..." id="year-search">
                    <input type="text" placeholder="Search by language..." id="language-search">
                    <input type="date" id="start-date">
                    <input type="date" id="end-date">
                </div>
            </div>

            <div class="all-matching-songs">
                <button id="load-all-button" style="background-color: blue; color: white;">Load All</button>
                <div id="song-list"></div>
            </div>
        </div>
    </SongList>

    <GenreGrid>
        <!-- Preview Image -->
        <div class="image-preview-container">
            <img src="genre-grid.PNG" alt="A colorful grid of genre names" class="preview-image"
                onclick="openLightbox()">
        </div>

        <!-- Lightbox -->
        <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
            <img src="genre-grid.PNG" alt="A colorful grid of genre names" class="lightbox-image">
            <button class="close-button" onclick="closeLightbox()">✖ Close</button>
        </div>
    </GenreGrid>


    <GenreProcessors>
        <div id="genre-processor">
            <h1>Genre Processor</h1>
            <textarea id="input-text" placeholder="Enter genres here..."></textarea>
            <button id="process-button">Process Genres</button>
            <textarea id="output-text" placeholder="Output will appear here..."></textarea>
        </div>

        <div id="unfiltered-processor">
            <h1>Unfiltered Genre Processor</h1>
            <h3>(Does not work yet)</h3>
            <textarea id="input-text" placeholder="Enter genres here..."></textarea>
            <button id="process-button">Process Unfiltered Genres</button>
            <textarea id="output-text" placeholder="Output will appear here..."></textarea>
        </div>
    </GenreProcessors>

    </main>
    <script src="script.js"></script>
    <script src="navbar.js"></script>
    <script src="state.js"></script>
    <!-- state.js currently doesn't work or help, but it's there -->
    <script src="songs2.js"></script>
    <script src="lightbox.js"></script>
    <script src="SongList.js"></script>
    <script src="GenreProcess.js"></script>
</body>

</html>
